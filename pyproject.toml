[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero_validation"
version = "0.1.0"
description = "Formula Student aerodynamics validation pipeline: telemetry processing, coastdown run extraction, and drag coefficient computation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "seaborn>=0.12",
    "asammdf>=7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aero_validation*"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["."]
